<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eFootball Mobile • Stats Co-oP & VS Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #060918;
      --bg-card: rgba(14, 22, 52, 0.82);
      --bg-card-hover: rgba(24, 38, 86, 0.94);
      --ef-blue: #0033ff;
      --ef-cyan: #00e5ff;
      --ef-yellow: #ffe600;
      --ef-pink: #ff007a;
      --gold: #ffd700;
      --silver: #e2e8f0;
      --bronze: #cd7f32;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-glow: rgba(0, 229, 255, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at 12% 15%, rgba(0, 51, 255, 0.35), transparent 40%),
        radial-gradient(circle at 88% 82%, rgba(255, 0, 122, 0.24), transparent 42%),
        var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 14px 40px;
    }

    .container { max-width: 1120px; margin: 0 auto; }

    .hero {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      margin-bottom: 18px;
    }

    .hero h1 {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(1.35rem, 3vw, 2rem);
      letter-spacing: 0.5px;
      color: var(--ef-cyan);
    }

    .hero p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .btn {
      background: linear-gradient(135deg, var(--ef-blue), #0099ff);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .status { font-size: 0.85rem; color: var(--text-muted); }

    .tabs-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--ef-cyan);
      color: #041024;
      border-color: var(--ef-cyan);
    }

    .podium-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .podium-item {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .podium-item.rank-1 { border-color: var(--gold); }
    .podium-item.rank-2 { border-color: var(--silver); }
    .podium-item.rank-3 { border-color: var(--bronze); }

    .medal { font-size: 1.5rem; }
    .podium-info small { display: block; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
    .podium-info strong { font-size: 1.1rem; display: block; margin-top: 2px; }
    .podium-info span { color: var(--ef-yellow); font-weight: 700; font-size: 0.9rem; }

    .table-wrap {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    th { color: var(--ef-cyan); font-size: 0.8rem; text-transform: uppercase; }
    tr:hover td { background: var(--bg-card-hover); }

    .msg-box {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 16px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div>
        <h1>STATS CO-OP &amp; VS ARENA</h1>
        <p>Clasamente și statistici live din Google Sheets</p>
      </div>
      <div class="controls">
        <button class="btn" id="refreshBtn" type="button">Actualizează Datele</button>
        <span class="status" id="statusText">Se încarcă...</span>
      </div>
    </div>

    <div class="tabs-wrapper" id="tabs"></div>
    <div id="messageArea"></div>
    <div class="podium-row" id="podium"></div>
    <div class="table-wrap" id="tableContainer"></div>
  </div>

  <script>
    const SHEET_ID = '1vq6QhFibkc_An845GzbfWqpNpiRz38FAE5LfIr9BQLY';
    const SHEET_NAME = 'Total';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

    let rawRows = [];
    let headers = [];
    let activeStatIndex = -1;

    const statusEl = document.getElementById('statusText');
    const msgEl = document.getElementById('messageArea');
    const tabsEl = document.getElementById('tabs');
    const podiumEl = document.getElementById('podium');
    const tableEl = document.getElementById('tableContainer');

    function parseGvizResponse(text) {
      const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?$/);
      if (!match) {
        throw new Error('Răspuns invalid de la Google Sheets. Verifică dacă sheet-ul este public.');
      }
      return JSON.parse(match[1]);
    }

    function getCellValue(cell) {
      if (!cell) return '';
      return cell.v !== null && cell.v !== undefined ? cell.v : '';
    }

    function renderAll() {
      if (!headers.length || !rawRows.length) {
        podiumEl.innerHTML = '';
        tableEl.innerHTML = '';
        msgEl.innerHTML = '<div class="msg-box">Nu s-au găsit rânduri de date în foaia <strong>Total</strong>.</div>';
        return;
      }

      msgEl.innerHTML = '';
      const numericCols = [];

      headers.forEach((h, idx) => {
        if (idx === 0) return;
        const hasNumbers = rawRows.some(r => typeof getCellValue(r.c[idx]) === 'number' || (!isNaN(parseFloat(getCellValue(r.c[idx]))) && String(getCellValue(r.c[idx])).trim() !== ''));
        if (hasNumbers) numericCols.push({ index: idx, label: h || `Col ${idx + 1}` });
      });

      if (activeStatIndex === -1 && numericCols.length) {
        activeStatIndex = numericCols[0].index;
      }

      tabsEl.innerHTML = numericCols.map(col => `
        <button class="tab-btn ${col.index === activeStatIndex ? 'active' : ''}" data-idx="${col.index}" type="button">
          ${col.label}
        </button>
      `).join('');

      tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeStatIndex = Number(btn.dataset.idx);
          renderAll();
        });
      });

      const sortedRows = [...rawRows].sort((a, b) => {
        const valA = parseFloat(getCellValue(a.c[activeStatIndex])) || 0;
        const valB = parseFloat(getCellValue(b.c[activeStatIndex])) || 0;
        return valB - valA;
      });

      const medals = ['🥇', '🥈', '🥉'];
      const statName = headers[activeStatIndex] || 'Scor';
      podiumEl.innerHTML = sortedRows.slice(0, 3).map((row, i) => {
        const player = getCellValue(row.c[0]) || `Jucător ${i + 1}`;
        const score = getCellValue(row.c[activeStatIndex]) || 0;
        return `
          <div class="podium-item rank-${i + 1}">
            <div class="medal">${medals[i]}</div>
            <div class="podium-info">
              <small>Locul ${i + 1} • ${statName}</small>
              <strong>${player}</strong>
              <span>${score}</span>
            </div>
          </div>
        `;
      }).join('');

      const thead = `<tr>${headers.map(h => `<th>${h || ''}</th>`).join('')}</tr>`;
      const tbody = sortedRows.map(row => `
        <tr>${headers.map((_, idx) => `<td>${getCellValue(row.c[idx])}</td>`).join('')}</tr>
      `).join('');

      tableEl.innerHTML = `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
    }

    async function loadData() {
      statusEl.textContent = 'Se încarcă datele...';
      try {
        const res = await fetch(`${GVIZ_URL}&t=${Date.now()}`);
        const text = await res.text();
        const json = parseGvizResponse(text);

        if (json.status === 'error') {
          throw new Error(json.errors?.[0]?.detailed_message || 'Eroare la citirea foii Total.');
        }

        const cols = json.table.cols || [];
        const rows = json.table.rows || [];

        headers = cols.map((c, i) => (c.label && c.label.trim()) ? c.label.trim() : `Col ${i + 1}`);
        rawRows = rows.filter(r => r && Array.isArray(r.c) && r.c.some(cell => cell && getCellValue(cell) !== ''));

        renderAll();
        const now = new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        statusEl.textContent = `● Sincronizat live la ${now}`;
      } catch (err) {
        statusEl.textContent = '⚠ Eroare la încărcare';
        podiumEl.innerHTML = '';
        tableEl.innerHTML = '';
        msgEl.innerHTML = `<div class="msg-box"><strong>Nu s-au putut încărca datele din Google Sheets:</strong><br>${err.message}<br>Verifică dacă sheet-ul <code>1vq6QhFibkc_An845GzbfWqpNpiRz38FAE5LfIr9BQLY</code> este partajat public (<em>Oricine are linkul poate vizualiza</em>) și are foaia numită <strong>Total</strong>.</div>`;
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadData);
    loadData();
  </script>
</body>
</html>
